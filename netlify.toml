# Netlify configuration for QUALITY Hearing Care.
#
# Build pipeline (see docs/DEPLOYMENT.md for the full walkthrough):
#   1. npm install        → runs `postinstall: prisma generate` (Prisma client)
#   2. tsx scripts/check-env.ts    → refuses to publish a misconfigured deploy
#   3. tsx scripts/db-prepare.ts   → applies the baseline schema on first deploy,
#      then verifies the schema AND the double-booking guard on every later one
#   4. next build
#
# The database is Turso (libSQL). Prisma Migrate does not support Turso, so
# there is no `prisma migrate deploy` step — see docs/DATABASE.md.
#
# Values that are SECRETS (TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, AUTH_SECRET)
# must be set in the Netlify UI, never here — this file is committed to the
# repository.

[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  # Pinned so a Netlify default change can't silently move the runtime.
  # package.json requires >=20.
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # The canonical public origin. Not a secret, so it lives here: it is inlined
  # at BUILD time into canonical tags, Open Graph URLs, sitemap.xml and
  # robots.txt, and a deploy that misses it would otherwise advertise the
  # fallback in src/lib/site-url.ts instead of the domain this site serves on.
  # A value set in the Netlify UI still wins over this one.
  NEXT_PUBLIC_SITE_URL = "https://qualityhearingcarepro.in"

# Netlify auto-detects this for Next.js sites; declaring it keeps the config
# self-describing and pins the major version.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Security headers ────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# The staff portal handles patient contact details and home-consultation
# addresses. It must never be indexed or reachable from a search result, even
# if a route is ever mis-linked from the public site.
[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Hashed build assets are immutable — cache them hard.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Licensed photography: long cache, but revalidated so a swap is picked up.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
