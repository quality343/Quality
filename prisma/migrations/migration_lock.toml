# Please do not edit this file manually
# It records which database provider the migrations in this folder target.
#
# QUALITY Hearing Care now runs on Turso (libSQL/SQLite). The previous
# PostgreSQL migration history is preserved in ../migrations-postgres-archive/.
#
# Note: Prisma Migrate does not support Turso, so these migrations are not
# applied with `prisma migrate deploy`. The baseline is rendered from the schema
# with `prisma migrate diff` and applied by scripts/turso-apply-schema.ts.
provider = "sqlite"
